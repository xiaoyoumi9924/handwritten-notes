[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MarkdownToHandwrite"
version = "0.1.0"
description = "Convert Markdown documents into handwritten-style PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markdown-it-py>=4.0.0",
  "mdit-py-plugins>=0.5.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pillow>=10,<13",
  "pillow-heif>=1,<2",
  "PyMuPDF>=1.24.0,<2",
  "reportlab>=4.0.0",
  "python-docx>=1.1,<2",
]

[project.scripts]
markdown-to-handwrite = "markdown_to_handwrite.cli:main"
markdown-to-handwrite-web = "markdown_to_handwrite.web:main"

[project.optional-dependencies]
scan-ai = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markdown_to_handwrite = ["webui/*.html", "webui/*.css", "webui/*.js", "webui/*.png", "assets/*.zip", "vendor/LICENSE-*.txt"]
