name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
          - os: macos-15
            target: macOS-Apple-Silicon
          - os: ubuntu-22.04
            target: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.lock -r requirements-desktop.lock
      - name: Build application
        run: python desktop/build.py
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Miaobi/Miaobi.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Compress-Archive -Path dist/Miaobi -DestinationPath Miaobi-Windows.zip
      - name: Smoke test on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dist/Miaobi.app/Contents/MacOS/Miaobi --smoke-test
          ditto -c -k --sequesterRsrc --keepParent dist/Miaobi.app Miaobi-${{ matrix.target }}.zip
      - name: Smoke test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dist/Miaobi/Miaobi --smoke-test
          tar -C dist -czf Miaobi-Linux.tar.gz Miaobi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            Miaobi-*.zip
            Miaobi-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-desktop packages/Miaobi-* --repo "$GITHUB_REPOSITORY" --clobber
