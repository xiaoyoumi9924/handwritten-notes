name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.lock -r requirements-desktop.lock
      - name: Build desktop app
        run: python desktop/build.py
      - name: Build and verify installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable' }
          & $compiler desktop/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = Join-Path $env:GITHUB_WORKSPACE 'dist-installer\Miaobi-Setup-Windows.exe'
          $install = Join-Path $env:RUNNER_TEMP 'Miaobi-installed'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) '妙笔工坊.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Desktop shortcut missing' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          Write-Host "Shortcut target: $($link.TargetPath); expected: $(Join-Path $install 'Miaobi.exe')"
          if (-not (Test-Path $link.TargetPath)) { throw 'Desktop shortcut target does not exist' }
          if ([IO.Path]::GetFileName($link.TargetPath) -ne 'Miaobi.exe') { throw 'Desktop shortcut points to the wrong program' }
          $app = Start-Process $link.TargetPath -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Installed app failed: $($app.ExitCode)" }
          $uninstall = Start-Process (Join-Path (Split-Path $link.TargetPath) 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $shortcut)) { throw 'Uninstall did not clean up shortcut' }
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0-desktop dist-installer/Miaobi-Setup-Windows.exe --repo "$env:GITHUB_REPOSITORY" --clobber
